<main class="container py-4">
  <!-- Componente 1: muestra aforo y regla de capacidad maxima -->
  <app-panel-aforo
    [ocupacionActual]="ocupacionActual()"
    [capacidadMaxima]="capacidadMaxima"
    [cuposDisponibles]="cuposDisponibles()"
    [capacidadCompleta]="capacidadCompleta()"
    [modoEdicion]="modoEdicion()"
  />

  <!-- Componente 2: captura/edicion de datos del paciente -->
  <app-paciente-form
    [formularioPaciente]="formularioPaciente"
    [modoEdicion]="modoEdicion()"
    [capacidadCompleta]="capacidadCompleta()"
    (guardar)="guardarPaciente()"
    (cancelar)="cancelarEdicion()"
  />

  <!-- Componente 3: lectura del CRUD (tabla) y acciones editar/eliminar -->
  <app-paciente-list
    [pacientes]="pacientes()"
    (editar)="editarPaciente($event)"
    (eliminar)="eliminarPaciente($event)"
  />
</main>
